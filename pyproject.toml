[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-cli"
version = "0.1.0"
description = "Command-line interface for vLLM-hosted models"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "httpx>=0.25",
    "rich>=13.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
vllm-cli = "vllm_cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["vllm_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
